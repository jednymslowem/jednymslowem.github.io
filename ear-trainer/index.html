<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ear Trainer</title>
<style>
  :root {
    --kw: 56px;   /* white key width  */
    --kbw: 36px;  /* black key width  */
    --gap: 6px;   /* gap between white keys */

    /* Answer states, from the Okabe-Ito colour-blind-safe palette. Sky blue vs
       vermillion rather than green vs red: the hues stay distinct under all
       three types of colour blindness, and the large lightness gap between
       them carries the signal even in pure greyscale. */
    --correct: #56B4E9;  /* sky blue   */
    --wrong:   #D55E00;  /* vermillion */
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 78px 0 44px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    background: #14161a;
    color: #e8eaed;
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ---- top bar ---- */

  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 13px 20px;
    background: #14161a;
    border-bottom: 1px solid #22262d;
  }

  h1 {
    margin: 0;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: #7c8697;
  }

  .score {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  /* tabular figures so the numbers don't jitter as the score ticks up */
  .tally {
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    font-size: 14px;
    color: #e8eaed;
  }
  .tally b { color: var(--correct); font-weight: 600; }

  .pct {
    font-variant-numeric: tabular-nums;
    font-size: 12px;
    color: #6b7383;
    min-width: 34px;
  }

  .reset, .switch {
    padding: 6px 12px;
    border-radius: 7px;
    background: #262a31;
    color: #98a1b0;
    font-size: 12px;
    font-weight: 600;
    transition: filter .12s ease;
  }
  .reset:hover, .switch:hover { filter: brightness(1.25); }

  /* ---- sharps switch ---- */

  .switch {
    display: flex;
    align-items: center;
    gap: 9px;
    padding-right: 10px;
    font-size: 14px;
    line-height: 1;
  }

  .track {
    position: relative;
    width: 30px;
    height: 17px;
    border-radius: 9px;
    background: #454b56;
    transition: background-color .16s ease;
  }
  .track::after {
    content: '';
    position: absolute;
    top: 2px;
    left: 2px;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: #e8eaed;
    transition: transform .16s ease;
  }
  .switch[aria-checked="true"] .track { background: var(--correct); }
  .switch[aria-checked="true"] .track::after { transform: translateX(13px); }

  button {
    font: inherit;
    cursor: pointer;
    border: none;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  /* ---- Play / Next ---- */

  .action {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 190px;
    padding: 14px 0;
    border-radius: 12px;
    font-weight: 600;
    letter-spacing: .02em;
    transition: transform .06s ease, filter .12s ease;
  }
  .action:hover { filter: brightness(1.12); }
  .action:active, .action.pressed { transform: scale(.97); }

  .play {
    background: #3b82f6;
    color: #fff;
    font-size: 17px;
    box-shadow: 0 6px 20px -6px #3b82f6aa;
  }

  .next {
    background: #262a31;
    color: #c3c9d4;
  }

  .action kbd {
    margin-left: 10px;
    padding: 3px 7px;
    border-radius: 4px;
    background: #ffffff2e;
    font: 600 10px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .06em;
    text-transform: uppercase;
  }
  .next kbd { background: #ffffff14; }

  /* ---- Keyboard ---- */

  .keyboard {
    position: relative;
    /* 7 white keys + 6 gaps */
    width: calc(7 * var(--kw) + 6 * var(--gap));
    height: 170px;
  }

  .whites {
    display: flex;
    gap: var(--gap);
    height: 100%;
  }

  .key {
    border-radius: 0 0 8px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: 9px;
    padding-bottom: 12px;
    font-weight: 600;
    transition: background-color .12s ease, color .12s ease, transform .06s ease;
  }
  .key:active, .key.pressed { transform: translateY(2px); }

  /* Shortcut hint. currentColor means it tracks the key's own colour,
     including the answer states. */
  .key kbd {
    padding: 2px 4px;
    border: 1px solid currentColor;
    border-radius: 3px;
    font: 600 9px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    text-transform: uppercase;
    opacity: .4;
  }

  .white {
    flex: 1;
    background: #f5f6f8;
    color: #3d4450;
    box-shadow: 0 4px 0 #b9bec7;
  }
  .white:hover { background: #fff; }

  .black {
    position: absolute;
    top: 0;
    /* centre the black key over the gap that follows white key --i */
    left: calc(var(--i) * (var(--kw) + var(--gap)) + var(--kw) + (var(--gap) - var(--kbw)) / 2);
    width: var(--kbw);
    height: 105px;
    z-index: 2;
    gap: 7px;
    background: #23272e;
    color: #98a1b0;
    font-size: 13px;
    box-shadow: 0 4px 0 #0c0e11, 0 6px 14px -4px #000;
  }
  .black:hover { background: #2d323b; }

  /* Answer states — override both key colours. Black text on both fills:
     9.4:1 on sky blue and 4.7:1 on vermillion, so the note name stays legible. */
  .key.correct { background: var(--correct); color: #000000; }
  .key.correct:hover { background: var(--correct); }
  .key.wrong   { background: var(--wrong);   color: #000000; }
  .key.wrong:hover { background: var(--wrong); }
  .key.correct kbd, .key.wrong kbd { opacity: .5; }

  /* Out of the pool with sharps switched off. Hidden rather than dimmed: black
     keys are stacked over the white ones, so a translucent one shows through as
     a pale smear instead of receding. visibility (not display) keeps the white
     row's flex sizing intact if a white key is ever pooled out too. The
     `disabled` attribute, not this rule, is what keeps them out of play. */
  .key:disabled { visibility: hidden; }

  footer {
    position: fixed;
    bottom: 10px;
    font-size: 11px;
    color: #4a515e;
  }
  footer a { color: inherit; }
</style>
</head>
<body>

  <header>
    <h1>Ear Trainer</h1>
    <div class="score">
      <span class="tally"><b id="hits">0</b> / <span id="rounds">0</span> first try</span>
      <span class="pct" id="pct"></span>
      <button class="switch" id="sharps" role="switch" aria-checked="true"
              aria-label="Include sharps" title="Include sharps">♯ <span class="track"></span></button>
      <button class="reset" id="reset">Reset</button>
    </div>
  </header>

  <button class="action play" id="play">▶&nbsp; Play <kbd>space</kbd></button>

  <div class="keyboard" id="keyboard">
    <div class="whites" id="whites"></div>
  </div>

  <button class="action next" id="next">Next&nbsp; ↻ <kbd>enter</kbd></button>

  <footer>
    Piano: Salamander Grand (Yamaha C5) by Alexander Holm —
    <a href="https://creativecommons.org/licenses/by/3.0/">CC BY 3.0</a>
  </footer>

<script>
  /* A note's shortcut is its own letter — C is "c", C♯ is "shift+c" — so
     there is nothing to memorise beyond the note names already on the keys. */

  const NOTES = [
    { name: 'C',  midi: 60 },
    { name: 'C♯', midi: 61, after: 0 },
    { name: 'D',  midi: 62 },
    { name: 'D♯', midi: 63, after: 1 },
    { name: 'E',  midi: 64 },
    { name: 'F',  midi: 65 },
    { name: 'F♯', midi: 66, after: 3 },
    { name: 'G',  midi: 67 },
    { name: 'G♯', midi: 68, after: 4 },
    { name: 'A',  midi: 69 },
    { name: 'A♯', midi: 70, after: 5 },
    { name: 'B',  midi: 71 },
  ];

  // Doubles as the hint printed on the key: '⇧' survives text-transform,
  // and the CSS upper-cases the letter.
  function shortcut(note) {
    return (note.name.includes('♯') ? '⇧' : '') + note.name[0].toLowerCase();
  }

  /* ---------------- piano samples ----------------
     Salamander Grand Piano, recorded every 3 semitones. Each anchor covers
     itself plus one semitone either side, so C4-B4 is reachable with at most
     a 1-semitone resample — the same thing any hardware sampler does.

     Deliberately HTMLAudioElement rather than fetch + decodeAudioData: the
     latter is blocked by CORS when index.html is opened straight off disk
     (file://), which is exactly how this app is meant to be used.

     Note length is baked into the files (2.0s, fading from 1.4s). To change
     it, re-run the ffmpeg trim in samples/CREDITS.txt with a new -t value.  */

  const ANCHORS = [
    { file: 'samples/C4.mp3',  midi: 60 },
    { file: 'samples/Ds4.mp3', midi: 63 },
    { file: 'samples/Fs4.mp3', midi: 66 },
    { file: 'samples/A4.mp3',  midi: 69 },
    { file: 'samples/C5.mp3',  midi: 72 },
  ];

  const VOICES = 3;          // per anchor, so repeated presses overlap instead of cutting off
  let samplesOk = true;      // flipped off if the samples folder is missing -> synth fallback

  ANCHORS.forEach(a => {
    a.pool = [];
    a.next = 0;
    for (let v = 0; v < VOICES; v++) {
      const el = new Audio(a.file);
      el.preload = 'auto';
      el.addEventListener('error', () => { samplesOk = false; });
      a.pool.push(el);
    }
  });

  function anchorFor(midi) {
    return ANCHORS.reduce((best, a) =>
      Math.abs(a.midi - midi) < Math.abs(best.midi - midi) ? a : best);
  }

  function playSample(midi) {
    const a = anchorFor(midi);
    const el = a.pool[a.next++ % a.pool.length];
    // Default is true, which would time-stretch and keep the original pitch —
    // the opposite of what a sampler needs.
    el.preservesPitch = el.mozPreservesPitch = el.webkitPreservesPitch = false;
    el.playbackRate = Math.pow(2, (midi - a.midi) / 12);
    el.volume = 0.85;
    try { el.currentTime = 0; } catch (e) { /* not buffered yet; plays from 0 anyway */ }
    el.play().catch(() => { samplesOk = false; playSynth(midi); });
  }

  /* ---------------- synth fallback ----------------
     Only used if samples/ can't be loaded, so the app still works if
     index.html gets moved on its own.                                      */

  let ctx = null;

  function audio() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  function playSynth(midi) {
    const ac = audio();
    const t = ac.currentTime;
    const osc = ac.createOscillator();
    const gain = ac.createGain();

    osc.type = 'triangle';
    osc.frequency.value = 440 * Math.pow(2, (midi - 69) / 12);

    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.linearRampToValueAtTime(0.25, t + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);

    osc.connect(gain).connect(ac.destination);
    osc.start(t);
    osc.stop(t + 1.2);
  }

  function playNote(midi) {
    if (samplesOk) playSample(midi);
    else playSynth(midi);
  }

  /* ---------------- keyboard ---------------- */

  const whites = document.getElementById('whites');
  const keyboard = document.getElementById('keyboard');
  const playBtn = document.getElementById('play');
  const nextBtn = document.getElementById('next');
  const keys = [];

  NOTES.forEach((note, i) => {
    const isBlack = note.after !== undefined;
    const btn = document.createElement('button');
    btn.className = 'key ' + (isBlack ? 'black' : 'white');
    btn.innerHTML = '<kbd></kbd><span></span>';
    btn.querySelector('kbd').textContent = shortcut(note);
    btn.querySelector('span').textContent = note.name;

    if (isBlack) {
      btn.style.setProperty('--i', note.after);
      keyboard.appendChild(btn);
    } else {
      whites.appendChild(btn);
    }

    // blur so a later space/enter can't re-trigger this button via focus
    btn.addEventListener('click', () => { btn.blur(); guess(i); });
    keys[i] = btn;
  });

  /* ---------------- note pool ----------------
     The ♯ switch narrows practice down to the seven naturals. Off-pool keys
     are disabled rather than hidden, so the keyboard still reads as a piano
     and a stray press can't cost you a first try on a note that was never
     going to be the answer.                                                */

  let sharpsOn = true;
  const inPlay = i => sharpsOn || NOTES[i].after === undefined;

  const sharpsBtn = document.getElementById('sharps');

  function applyPool() {
    sharpsBtn.setAttribute('aria-checked', sharpsOn);
    keys.forEach((btn, i) => { btn.disabled = !inPlay(i); });
  }

  sharpsBtn.addEventListener('click', () => {
    sharpsBtn.blur();
    sharpsOn = !sharpsOn;
    applyPool();
    // Only disturb the round in progress if its answer just left the pool,
    // so switching sharps back on never throws away the note you're on.
    if (!inPlay(target)) newRound(false);
  });

  /* ---------------- round state ---------------- */

  let target = -1;     // -1 on load, so the first draw can never "repeat"
  let solved = false;
  let counted = false; // has this round been scored yet

  /* Score is FIRST-TRY accuracy. Scoring "did you eventually get it" would be
     meaningless here, since you can keep guessing until you do. A round only
     counts once you actually guess, so skipping with Next never hurts you. */

  let hits = 0, rounds = 0;
  const hitsEl = document.getElementById('hits');
  const roundsEl = document.getElementById('rounds');
  const pctEl = document.getElementById('pct');
  const resetBtn = document.getElementById('reset');

  function renderScore() {
    hitsEl.textContent = hits;
    roundsEl.textContent = rounds;
    pctEl.textContent = rounds ? Math.round(100 * hits / rounds) + '%' : '';
  }

  function newRound(autoplay) {
    let n;
    do { n = Math.floor(Math.random() * NOTES.length); } while (n === target || !inPlay(n));
    target = n;
    solved = false;
    counted = false;
    keys.forEach(k => k.classList.remove('correct', 'wrong'));
    if (autoplay) playNote(NOTES[target].midi);
  }

  function guess(i) {
    playNote(NOTES[i].midi);       // always plays, before and after solving
    if (solved) return;            // colours freeze once the answer is found

    if (!counted) {                // only the first guess of a round scores
      counted = true;
      rounds++;
      if (i === target) hits++;
      renderScore();
    }

    if (i === target) {
      keys[i].classList.add('correct');
      solved = true;
    } else {
      keys[i].classList.add('wrong');
    }
  }

  // Zeroes the tally only — deliberately leaves the round in progress alone,
  // so hitting Reset doesn't also throw away the note you're working on.
  // `counted` is left as-is on purpose: if you've already guessed in this
  // round, it stays excluded rather than being re-scored with a wrong-answer
  // key already on screen telling you what it isn't.
  resetBtn.addEventListener('click', () => {
    resetBtn.blur();
    hits = rounds = 0;
    renderScore();
  });

  playBtn.addEventListener('click', () => { playBtn.blur(); playNote(NOTES[target].midi); });
  nextBtn.addEventListener('click', () => { nextBtn.blur(); newRound(true); });

  /* ---------------- shortcuts ---------------- */

  const BY_KEY = {};
  NOTES.forEach((note, i) => { BY_KEY[shortcut(note)] = i; });

  // brief highlight so a keypress gives the same feedback as a click
  function flash(el) {
    el.classList.add('pressed');
    setTimeout(() => el.classList.remove('pressed'), 110);
  }

  document.addEventListener('keydown', e => {
    if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;

    if (e.code === 'Space') {
      e.preventDefault();                      // also stops the page scrolling
      flash(playBtn);
      playNote(NOTES[target].midi);
      return;
    }

    if (e.key === 'Enter') {
      e.preventDefault();
      flash(nextBtn);
      newRound(true);
      return;
    }

    // e.shiftKey rather than the case of e.key, so caps lock can't turn a
    // natural into a sharp
    const i = BY_KEY[(e.shiftKey ? '⇧' : '') + e.key.toLowerCase()];
    if (i !== undefined && !keys[i].disabled) {
      e.preventDefault();
      flash(keys[i]);
      guess(i);
    }
  });

  renderScore();
  applyPool();
  newRound(false);   // first sound should be a deliberate press of Play
</script>

</body>
</html>
